<center><h3 class="mt-4 mb-3 text-primary">All Live Bus Locations</h3></center>

<div id="map"></div>

<script>
window.addEventListener("load", () => document.body.classList.add("loaded"));

const FUNCTION_BASE = "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api";

let map = null;
let mapInitialized = false;

// ✅ Key-to-marker map: { bus_no: atlas.HtmlMarker }
let markers = {};

// ✅ Fetch Azure Maps key from your Function
async function getMapsKey() {
    const res = await fetch(`${FUNCTION_BASE}/get_maps_config`);
    const data = await res.json();
    if (!data.key) throw new Error("Azure Maps key not returned.");
    return data.key;
}

// ✅ Initialize map once (centered on your area)
async function initMap() {
    const mapsKey = await getMapsKey();

    // ⚠️ Azure Maps uses [longitude, latitude] order
    map = new atlas.Map("map", {
        center: [80.4583, 16.3061],
        zoom: 12,
        style: "road",
        language: "en-US",
        authOptions: {
            authType: "subscriptionKey",
            subscriptionKey: mapsKey,
        },
    });

    map.events.add("ready", function () {
        mapInitialized = true;
        // Load buses after map is ready
        loadBuses();
        setInterval(loadBuses, 10000);
    });
}

// ✅ Build popup HTML for each bus
function buildPopupContent(bus) {
    return `
        <div style="padding:10px 14px;font-family:Arial,sans-serif;font-size:14px;min-width:180px;">
            <p style="margin:0 0 6px;font-size:15px;font-weight:bold;color:#0078d4;">🚌 Bus No: ${bus.bus_no}</p>
            <p style="margin:0 0 4px;"><b>Driver:</b> ${bus.username || "N/A"}</p>
            <p style="margin:0;color:#666;font-size:12px;">Updated: ${bus.last_updated || "N/A"}</p>
        </div>
    `;
}

// ✅ Fetch all bus locations and update markers
async function loadBuses() {
    if (!mapInitialized) return;

    try {
        const res = await fetch(`${FUNCTION_BASE}/ad_map`, {
            method: "GET",
            credentials: "include",
            headers: {
                "ad_session": localStorage.getItem("ad_session"),
            },
        });

        if (res.status === 401) {
            alert("Session expired. Please login again.");
            localStorage.removeItem("ad_session");
            window.location.href = "ad_login.html";
            return;
        }

        const data = await res.json();

        // ── Remove markers for buses no longer in data ──
        for (let bus_no in markers) {
            if (!data.find(b => b.bus_no === bus_no)) {
                map.markers.remove(markers[bus_no]);
                delete markers[bus_no];
            }
        }

        // ── Add or update each bus marker ──────────────
        data.forEach(bus => {
            if (!bus.latitude || !bus.longitude) return;

            // ⚠️ [longitude, latitude] order for Azure Maps
            const position = [parseFloat(bus.longitude), parseFloat(bus.latitude)];

            if (markers[bus.bus_no]) {
                // Update existing marker position and popup
                markers[bus.bus_no].setOptions({ position: position });
                markers[bus.bus_no].getOptions().popup.setOptions({
                    content: buildPopupContent(bus),
                });
            } else {
                // Create new marker with popup
                const popup = new atlas.Popup({
                    content: buildPopupContent(bus),
                    pixelOffset: [0, -36],
                    closeButton: true,
                });

                const marker = new atlas.HtmlMarker({
                    position: position,
                    color: "#0078d4",
                    popup: popup,
                });

                // Click to open popup
                map.events.add("click", marker, function () {
                    marker.togglePopup();
                });

                map.markers.add(marker);
                markers[bus.bus_no] = marker;
            }
        });

    } catch (err) {
        console.error("Map Error:", err);
    }
}

function logout() {
    localStorage.removeItem("ad_session");
    window.location.href = "ad_login.html";
}

// ✅ Start everything
initMap();
</script>

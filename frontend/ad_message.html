<div class="table-responsive" id="msgContainer">
    <div class="text-center">Loading messages...</div>
</div>

<script>
window.addEventListener("load", () => { document.body.classList.add("loaded"); });

const API_URL = "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/ad_message";

async function loadMessages(){
    let res = await fetch(API_URL, {
        headers: {
            "ad_session": localStorage.getItem("ad_session")  // ✅ Send session token
        }
    });

    // If session expired
    if(res.status === 401){
        alert("Session expired. Please login again.");
        localStorage.removeItem("ad_session");
        return window.location.href = "ad_ad_login.html";
    }

    let data = await res.json();
    let container = document.getElementById("msgContainer");

    if(!Array.isArray(data) || data.length === 0){
        container.innerHTML = `<div class="alert alert-warning">No messages found.</div>`;
        return;
    }

    let html = `
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Date-Time</th>
        </tr>
      </thead>
      <tbody>
    `;

    data.forEach(m => {
        html += `
            <tr>
              <td>${m.name}</td>
              <td>${m.email}</td>
              <td>${m.message}</td>
              <td>${m.date_time}</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
}

loadMessages();
</script>

<script>
function logout() {
    localStorage.removeItem("ad_session");
    window.location.href = "ad_login.html";
}
</script>

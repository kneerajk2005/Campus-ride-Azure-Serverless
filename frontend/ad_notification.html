<div class="container mt-5">
  <h2 class="text-primary mb-4">Add Notification</h2>

  <div id="msgbox"></div>

  <div class="mb-3">
    <label class="form-label">Title:</label>
    <input type="text" class="form-control" id="title">
  </div>

  <div class="mb-3">
    <label class="form-label">Message:</label>
    <textarea class="form-control" id="message" rows="4"></textarea>
  </div>

  <button onclick="addNotification()" class="btn btn-success">Add Notification</button>
</div>

<script>
const API_ADD = "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/add_notification";

// Generates unique ID for each notification
function uuid(){
 return crypto.randomUUID();
}

async function addNotification(){
  const session = localStorage.getItem("ad_session");

  let data = {
    id: uuid(),
    title: document.getElementById("title").value,
    message: document.getElementById("message").value
  };

  let res = await fetch(API_ADD,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "ad_session": session   // ✅ send session token
    },
    body: JSON.stringify(data)
  });

  if (res.status === 401) {
    alert("Session expired. Please login again.");
    localStorage.removeItem("ad_session");
    window.location.href = "ad_login.html";
    return;
  }

  let out = await res.json();
  document.getElementById("msgbox").innerHTML =
     `<div class="alert alert-info">${out.message || out.error}</div>`;

  // Optional: Clear form after success
  if (res.ok) {
    document.getElementById("title").value = "";
    document.getElementById("message").value = "";
  }
}
</script>

<div class="form-container">
  <h2>Add Bus</h2>

  <form id="addBusForm">

    <label>Driver Name</label>
    <input type="text" id="name" required>

    <label>Driver ID</label>
    <input type="text" id="bus_id" required>

    <label>Route</label>
    <input type="text" id="route" required>

    <label>Bus Number</label>
    <input type="text" id="bus_no" required>

    <label>Maximum Seating</label>
    <input type="text" id="maximum_seating" required>

    <label>Minimum Seating</label>
    <input type="text" id="minimum_seating" required>

    <label>Contact Number</label>
    <input type="tel" id="contact" required pattern="[0-9]{10}">

    <label>Address</label>
    <textarea id="address" rows="4"></textarea>

    <label>Driver Username</label>
    <input type="text" id="username" required>

    <label>Driver Password</label>
    <input type="password" id="password" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <button type="submit">Add</button>
  </form>
</div>

<script>
document.getElementById("addBusForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const data = {
        bus_id: document.getElementById("bus_id").value,
        name: document.getElementById("name").value,
        route: document.getElementById("route").value,
        bus_no: document.getElementById("bus_no").value,
        maximum_seating: document.getElementById("maximum_seating").value,
        minimum_seating: document.getElementById("minimum_seating").value,
        contact: document.getElementById("contact").value,
        address: document.getElementById("address").value,
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
        email: document.getElementById("email").value

    };

    const response = await fetch("https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/add_bus", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "ad_session": localStorage.getItem("ad_session") // ✅ Send session
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.status === 401) {
        alert("Session expired. Please login again.");
        localStorage.removeItem("ad_session");
        window.location.href = "ad_login.html";
        return;
    }

    if (response.ok) {
        alert("✅ Bus Added Successfully!");
        document.getElementById("addBusForm").reset();
    } else {
        alert("❌ Failed: " + (result.error || "Please try again."));
    }
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Student</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: white;
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }
    body.loaded {
      opacity: 1;
    }
    .form-container {
      background: white;
      padding: 30px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid black;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .alert-message {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .alert-success {
      color: green;
    }
    .alert-error {
      color: red;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <img src="logo.png" alt="logo" width="100" height="90">
      </a>
      <ul class="nav justify-content-end">
        <li class="nav-item"><a class="nav-link active" href="ad_dashboard.html">Admin</a></li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Student</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="addstudent.html">Add</a></li>
            <li><a class="dropdown-item" href="update_student.html">Update</a></li>
            <li><a class="dropdown-item" href="student_view.html">View</a></li>
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Bus</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="add_bus.html">Add</a></li>
            <li><a class="dropdown-item" href="update_bus.html">Update</a></li>
            <li><a class="dropdown-item" href="busview.html">View</a></li>
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Notifications</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="admin_notification.html">Notifications</a></li>
            <li><a class="dropdown-item" href="ad_notification.html">Add Notifications</a></li>
          </ul>
        </li>

        <li class="nav-item"><a class="nav-link active" href="ad_message.html">Message</a></li>
        <li class="nav-item"><a class="nav-link active" href="ad_map.html">Location</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </div>
  </nav>

  <br><br>

  <div class="container mt-5">
    <div class="form-container">
      <h2>Add Student</h2>

      <p id="alertMsg" class="alert-message"></p>

      <form id="addStudentForm">
        <label for="student_id">Student ID</label>
        <input type="text" id="student_id" name="student_id" required>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="department">Department</label>
        <input type="text" id="department" name="department" required>

        <label for="year">Year</label>
        <select id="year" name="year" required>
          <option value="">Select Year</option>
          <option value="1st">1st Year</option>
          <option value="2nd">2nd Year</option>
          <option value="3rd">3rd Year</option>
          <option value="4th">4th Year</option>
        </select>

        <label for="pickup_location">Pickup Location</label>
        <input type="text" id="pickup_location" name="pickup_location" required>

        <label for="bus_number">Bus Number</label>
        <input type="text" id="bus_number" name="bus_number" required>

        <label for="contact_number">Contact Number</label>
        <input type="tel" id="contact_number" name="contact_number" required pattern="[0-9]{10}" placeholder="10-digit mobile number">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">Add</button>
      </form>
    </div>
  </div>

  <div class="container">
    <footer class="py-3 my-4">
      <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Features</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Pricing</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
      </ul>
      <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
    </footer>
  </div>

  <script>
    window.addEventListener("load", () => document.body.classList.add("loaded"));

    // ✅ Admin session check
    const session = localStorage.getItem("ad_session");
    if (!session) {
      alert("Unauthorized! Please login as admin.");
      window.location.href = "/ad_ad_login.html";
    }

    document.getElementById("addStudentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alertMsg");
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch("https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/add_student", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ad_session": session
          },
          body: JSON.stringify(data)
        });

        let result;
        try {
          result = await res.json();
        } catch {
          throw new Error("Invalid JSON from server");
        }

        if (res.ok) {
          alertBox.textContent = "✅ Student added successfully!";
          alertBox.className = "alert-message alert-success";
          e.target.reset();
        } else {
          alertBox.textContent = "❌ " + (result.error || "Failed to add student");
          alertBox.className = "alert-message alert-error";
        }
      } catch (err) {
        alertBox.textContent = "⚠️ Server connection error.";
        alertBox.className = "alert-message alert-error";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("ad_session");
      window.location.href = "ad_ad_login.html";
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<div class="container mt-5">
    <h2 class="text-primary mb-4">All Notifications</h2>

    <div id="notifBody"></div>
</div>

<script>
const API_URL = "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/ad_notification";

document.addEventListener("DOMContentLoaded", async () => {
  document.body.classList.add("loaded");

  const session = localStorage.getItem("ad_session");

  let res = await fetch(API_URL, {
    method: "GET",
    headers: { "ad_session": session } // ✅ Session sent
  });

  if (res.status === 401) {
    alert("Session expired. Please login again.");
    localStorage.removeItem("ad_session");
    window.location.href = "ad_ad_login.html";
    return;
  }

  let data = await res.json();
  let notifications = data.notifications || [];

  let body = document.getElementById("notifBody");

  if (notifications.length === 0) {
    body.innerHTML = `<div class="alert alert-info">No notifications found.</div>`;
    return;
  }

  let html = `<ul class="list-group">`;
  notifications.forEach(n => {
    html += `
      <li class="list-group-item">
        <strong>${n.title}</strong><br>
        ${n.message}
      </li>`;
  });
  html += `</ul>`;

  body.innerHTML = html;
});
</script>

<script>
function logout() {
  localStorage.removeItem("ad_session");
  window.location.href = "ad_login.html";
}
</script>

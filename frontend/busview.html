<div class="search-container text-end my-3">
  <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Search bus...">
</div>

<div class="container mt-4">
  <center><h2>Bus Details</h2></center><br>

  <div class="table-responsive">
    <table class="table table-bordered table-striped" id="busTable">
        <thead class="table-dark">
            <tr>
                <th>Bus ID</th>
                <th>Name</th>
                <th>Route</th>
                <th>Bus Number</th>
                <th>Max Seating</th>
                <th>Min Seating</th>
                <th>Contact</th>
                <th>Address</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="busBody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/busview";

document.addEventListener("DOMContentLoaded", async () => {
  document.body.classList.add("loaded");

  const session = localStorage.getItem("ad_session");

  let res = await fetch(API_URL, {
    method: "GET",
    headers: { "ad_session": session }  // ✅ Send session
  });

  if (res.status === 401) {
    alert("Session expired. Please login again.");
    localStorage.removeItem("ad_session");
    window.location.href = "ad_login.html";
    return;
  }

  let buses = await res.json();
  let body = document.getElementById("busBody");
  body.innerHTML = "";

  buses.forEach(bus => {
    body.innerHTML += `
      <tr>
        <td>${bus.bus_id}</td>
        <td>${bus.name}</td>
        <td>${bus.route}</td>
        <td>${bus.bus_no}</td>
        <td>${bus.maximum_seating}</td>
        <td>${bus.minimum_seating}</td>
        <td>${bus.contact}</td>
        <td>${bus.address}</td>
        <td>${bus.username}</td>
        <td>${bus.email}</td>
      </tr>`;
  });
});

function searchTable() {
  let filter = document.getElementById("searchInput").value.toUpperCase();
  let tr = document.getElementById("busTable").getElementsByTagName("tr");
  for (let i = 1; i < tr.length; i++) {
    let match = [...tr[i].getElementsByTagName("td")].some(td => td.innerText.toUpperCase().includes(filter));
    tr[i].style.display = match ? "" : "none";
  }
}

function logout() {
  localStorage.removeItem("ad_session");
  window.location.href = "ad_login.html";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

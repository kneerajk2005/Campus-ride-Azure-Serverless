<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Contact</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        background: white;
        transition: opacity 0.5s ease-in;
        opacity: 0;
      }
      body.loaded { opacity: 1; }
      form {
        max-width: 600px;
        margin: 0 auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        border-radius: 10px;
        padding: 30px;
        max-width: 500px;
      }
      h2 { font-size: 28px; }
      p { margin-bottom: 20px; }
      label {
        display: block;
        font-weight: bold;
        margin: 15px 0 5px;
      }
      input, textarea, select {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 4px;
        border: 1px solid black;
        font-size: 16px;
      }
      .row { display: flex; gap: 20px; }
      .row > div { flex: 1; }
      .checkbox { margin-top: 10px; }
      button {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 20px;
      }
      button:hover { background-color: #0056b3; }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <img src="logo.png" width="100" height="90">
    </a>
    <ul class="nav justify-content-end">
      <li class="nav-item"><a class="nav-link active" href="driver_dashboard.html">Profile</a></li>
      <li class="nav-item"><a class="nav-link active" href="driver_route.html">Route Info</a></li>
      <li class="nav-item"><a class="nav-link active" href="student_list.html">Student List</a></li>
      <li class="nav-item"><a class="nav-link active" href="driver_notifications.html">Notifications</a></li>
      <li class="nav-item"><a class="nav-link active" href="bus_map.html">Location</a></li>
      <li class="nav-item"><a class="nav-link active" href="contact_driver.html">Contact</a></li>
      <li class="nav-item"><a class="nav-link" onclick="logout()">Logout</a></li>
    </ul>
  </div>
</nav>

<br><br>

<div id="alertBox"></div>

<form id="contactForm">
  <h2 style="color: #007bff;">Contact Form</h2>
  <p>Please fill out the form to contact us.</p>

  <div class="row">
    <div>
      <label>Name</label>
      <input type="text" id="name" required>
    </div>
    <div>
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
  </div>

  <label>Phone Number</label>
  <input type="text" id="phone_no" required pattern="[0-9]{10}">

  <label>Role</label>
  <select id="role">
    <option>Driver</option>
  </select>

  <label>Reason</label>
  <textarea id="message" rows="5" required></textarea>
  </label>
  <br>
 <div class="d-flex align-items-center mt-2" style="gap:8px;">
  <input type="checkbox" id="terms" style="width:18px; height:18px;">
  <label for="terms" style="margin:0; font-weight:bold;">
    I accept the terms and conditions.
  
</div>

  </label>
</div>
    <br>
  <button type="submit">Submit</button>
</form>

<br><br><br>

<div class="container">
  <footer class="py-3 my-4">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Features</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Pricing</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
    <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
  </footer>
</div>

<script>
window.addEventListener('load', () => document.body.classList.add('loaded'));

document.getElementById("contactForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  
  const alertBox = document.getElementById("alertBox");

  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone_no: document.getElementById("phone_no").value,
    role: document.getElementById("role").value,
    message: document.getElementById("message").value,
    terms_accepted: document.getElementById("terms").checked
  };

  const res = await fetch("https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/contact_driver", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  alertBox.innerHTML = `<div class="alert ${res.ok ? 'alert-success':'alert-danger'}">${data.success || data.error}</div>`;

  if(res.ok) document.getElementById("contactForm").reset();
});

function logout(){
  localStorage.removeItem("driver_data");
  window.location.href = "driver_login.html";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

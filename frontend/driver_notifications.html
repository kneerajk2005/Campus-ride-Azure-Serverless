<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Notifications</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: white;
      opacity: 0;
      transition: opacity .5s ease-in;
    }
    body.loaded { opacity: 1; }

    .notification-card {
      background: #f8f9fa;
      border-left: 6px solid #007bff;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .date {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand">
      <img src="logo.png" width="100" height="90">
    </a>
    <ul class="nav justify-content-end">
      <li class="nav-item"><a class="nav-link" href="driver_dashboard.html">Profile</a></li>
      <li class="nav-item"><a class="nav-link" href="driver_route.html">Route Info</a></li>
      <li class="nav-item"><a class="nav-link" href="student_list.html">Student List</a></li>
      <li class="nav-item"><a class="nav-link" href="driver_notifications.html">Notifications</a></li>
      <li class="nav-item"><a class="nav-link" href="bus_map.html">Location</a></li>
      <li class="nav-item"><a class="nav-link" href="contact_driver.html">Contact</a></li>
      <li class="nav-item"><a class="nav-link" onclick="logout()">Logout</a></li>
    </ul>
  </div>
</nav>

<div class="container mt-4">
  <h2 style="color: #007bff;">Driver Notifications</h2>
  <div id="notificationsList"></div>
  <br>
</div>

<script>
  window.addEventListener('load', () => document.body.classList.add('loaded'));

  async function loadNotifications() {
    const response = await fetch("https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/driver_notifications");
    const data = await response.json();

    const container = document.getElementById("notificationsList");
    container.innerHTML = "";

    if (!data.notifications || data.notifications.length === 0) {
      container.innerHTML = `<div class='alert alert-info'>No notifications available.</div>`;
      return;
    }

    data.notifications.forEach(n => {
      container.innerHTML += `
        <div class="notification-card">
          <div style="font-weight:bold; font-size:18px;">${n.title ?? "Notification"}</div>
          <div class="date">${n.message}</div>
        </div>`;
    });
  }

  function logout() {
    localStorage.removeItem("driver_data");
    window.location.href = "driver_login.html";
  }

  loadNotifications();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

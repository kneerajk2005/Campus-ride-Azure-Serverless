<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: white;
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }
    body.loaded { opacity: 1; }
    form {
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 30px;
    }
    h2 { font-size: 28px; color: #007bff; }
    label { display: block; font-weight: bold; margin: 15px 0 5px; }
    input[type="text"], input[type="email"], textarea {
      width: 100%; padding: 12px; margin-bottom: 10px;
      border-radius: 4px; border: 1px solid black; font-size: 16px;
    }
    button {
      background-color: #007bff; color: white;
      padding: 10px 20px; font-size: 16px;
      border: none; border-radius: 5px; cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background-color: #0056b3; }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="student_profile.html">
      <img src="logo.png" alt="logo" width="100" height="90">
    </a>
    <ul class="nav justify-content-end">
      <li class="nav-item"><a class="nav-link" href="student_profile.html">Profile</a></li>
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Bus Info</a>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="student_bus.html">Bus Details</a></li>
          <li><a class="dropdown-item" href="update_pickup.html">Update Pickup</a></li>
        </ul>
      </li>
      <li class="nav-item"><a class="nav-link" href="student_notification.html">Notifications</a></li>
      <li class="nav-item"><a class="nav-link" href="student_map.html">Location</a></li>
      <li class="nav-item"><a class="nav-link active" href="student_contact.html">Contact</a></li>
      <li class="nav-item"><a class="nav-link" href="student_login.html" onclick="logout()">Logout</a></li>
    </ul>
  </div>
</nav>

<br><br>

<form id="contactForm">
  <h2>Contact Form</h2>
  <p>Please fill out the form to contact us.</p>

  <label>Name</label>
  <input type="text" id="name" required>

  <label>Email</label>
  <input type="email" id="email" required>

  <label>Phone Number</label>
  <input type="text" id="phone_no" required pattern="[0-9]{10}">

  <label>Reason</label>
  <textarea id="message" rows="5" required placeholder="Reason for contacting..."></textarea>

  <div>
    <input type="checkbox" id="terms">
    <label for="terms">I accept the terms and conditions.</label>
  </div>

  <button type="submit">Submit</button>
</form>

<br><br>

<footer class="py-3 my-4 border-top">
  <p class="text-center text-body-secondary">© 2025 Campus Ride System</p>
</footer>

<script>
window.addEventListener('load', () => document.body.classList.add('loaded'));

// ✅ Logout function
function logout() {
  localStorage.removeItem("student_data");
  document.cookie = "st_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
  window.location.href = "student_login.html";
}

// ✅ Check if student is logged in
const student = JSON.parse(localStorage.getItem("student_data"));
if (!student || !student.username1) {
  alert("Please log in first to contact us.");
  window.location.href = "student_login.html";
}

// ✅ Submit Contact Form securely
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone_no: document.getElementById("phone_no").value.trim(),
    message: document.getElementById("message").value.trim(),
    terms_accepted: document.getElementById("terms").checked
  };

  try {
    const res = await fetch(
      "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/contact_student",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
        credentials: "include"  // ✅ sends session cookie for backend validation
      }
    );

    // 🔐 Check for unauthorized access
    if (res.status === 401 || res.status === 403) {
      alert("Session expired or unauthorized. Please log in again.");
      logout();
      return;
    }

    const result = await res.json();
    alert(result.message || result.error);

    if (res.ok) {
      document.getElementById("contactForm").reset();
    }

  } catch (err) {
    console.error("Error:", err);
    alert("Error sending message. Please try again later.");
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

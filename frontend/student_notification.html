      transition: opacity 0.5s ease-in;
    }
    body.loaded { opacity: 1; }
  </style>
</head>

<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="student_profile.html">
      <img src="logo.png" alt="logo" width="100" height="90">
    </a>
    <ul class="nav justify-content-end">
      <li class="nav-item"><a class="nav-link" href="student_profile.html">Profile</a></li>

      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Bus Info</a>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="student_bus.html">Bus Details</a></li>
          <li><a class="dropdown-item" href="update_pickup.html">Update Pickup</a></li>
        </ul>
      </li>

      <li class="nav-item"><a class="nav-link active" href="student_notification.html">Notifications</a></li>

  </div>

<br><br>

<div class="container mt-4">
  <h2 class="text-primary mb-4">Notifications</h2>
  <div id="notificationList"></div>
</div>

<br><br><br>

<footer class="py-3 my-4 border-top">
  <p class="text-center text-body-secondary">© 2025 Campus Ride System</p>
</footer>

<script>
window.addEventListener('load', () => document.body.classList.add('loaded'));

// ✅ Logout function
function logout() {
  localStorage.removeItem("student_data");
  // remove backend session cookie too
  document.cookie = "st_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
  window.location.href = "student_login.html";
}

// ✅ Security check before page load
const student = JSON.parse(localStorage.getItem("student_data"));
if (!student || !student.username1) {
  alert("Please log in first to access notifications.");
  window.location.href = "student_login.html";
}

// ✅ Fetch notifications securely
async function loadNotifications() {
  const container = document.getElementById("notificationList");
  container.innerHTML = `<div class="alert alert-info">Loading notifications...</div>`;

  try {
    const response = await fetch(
      "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/std_notification?username1=${student.username1}",
      {
        method: "GET",
       
      }
    );

    if (response.status === 401) {
      // ❌ Not logged in — redirect
      alert("Session expired. Please log in again.");
      logout();
      return;
    }

    const data = await response.json();

    if (!Array.isArray(data) || data.length === 0 ) {
      container.innerHTML = `<div class="alert alert-warning text-center">No notifications found.</div>`;
      return;
    }

    // ✅ Show notifications
    container.innerHTML = "";
    data.forEach(note => {
      container.innerHTML += `
        <div class="alert alert-info mb-2 shadow-sm">
          <h5 class="text-dark">${note.title || "No Title"}</h5>
          <p>${note.message || ""}</p>
        </div>
      `;
    });

  } catch (error) {
    console.error("Error loading notifications:", error);
    container.innerHTML = `<div class="alert alert-danger text-center">Error loading notifications. Please try again later.</div>`;
  }
}

// ✅ Load on page open
loadNotifications();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<div class="container content-container">

<div class="search-container text-end mb-3">
  <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Search Bus...">
</div>

<center><h2 class="mb-4">Update Buses</h2></center>

<div class="table-responsive">
<table class="table table-bordered" id="busTable">
  <thead class="table-dark">
    <tr>
      <th>Bus ID</th>
      <th>Name</th>
      <th>Route</th>
      <th>Bus Number</th>
      <th>Max Seating</th>
      <th>Min Seating</th>
      <th>Contact</th>
      <th>Address</th>
      <th>Email</th>
      <th>Modify</th>
    </tr>
  </thead>
  <tbody id="busBody"></tbody>
</table>
</div>

</div>

<script>
const API_URL = "https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/update_bus";

document.addEventListener("DOMContentLoaded", async () => {
  document.body.classList.add("loaded");

  const session = localStorage.getItem("ad_session");

  let res = await fetch(API_URL, {
    method: "GET",
    headers: { "ad_session": session } // ✅ Session sent
  });

  if (res.status === 401) {
    alert("Session expired. Please login again.");
    localStorage.removeItem("ad_session");
    window.location.href = "ad_login.html";
    return;
  }

  let buses = await res.json();
  let body = document.getElementById("busBody");
  body.innerHTML = "";

  buses.forEach(bus => {
    body.innerHTML += `
      <tr>
        <td><b>${bus.bus_id}</b></td>
        <td><input class="form-control" name="name" value="${bus.name}"></td>
        <td><input class="form-control" name="route" value="${bus.route}"></td>
        <td><input class="form-control" name="bus_no" value="${bus.bus_no}"></td>
        <td><input class="form-control" name="maximum_seating" value="${bus.maximum_seating}"></td>
        <td><input class="form-control" name="minimum_seating" value="${bus.minimum_seating}"></td>
        <td><input class="form-control" name="contact" value="${bus.contact}"></td>
        <td><input class="form-control" name="address" value="${bus.address}"></td>
        <td><input class="form-control" name="email" value="${bus.email}"></td>
        <td><button class="btn btn-warning btn-sm" onclick="updateBus(this, '${bus.bus_id}')">Update</button></td>
      </tr>
    `;
  });
});

async function updateBus(btn, bus_id) {
  const session = localStorage.getItem("ad_session");

  let row = btn.closest("tr");
  let data = { bus_id };
  row.querySelectorAll("input").forEach(i => data[i.name] = i.value);

  let res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "ad_session": session // ✅ Session sent
    },
    body: JSON.stringify(data)
  });

  let result = await res.json();
  alert(result.message || JSON.stringify(result));
}

function searchTable() {
  let filter = document.getElementById("searchInput").value.toUpperCase();
  let tr = document.getElementById("busTable").getElementsByTagName("tr");
  for (let i = 1; i < tr.length; i++) {
    let match = [...tr[i].getElementsByTagName("td")]
      .some(td => td.innerText.toUpperCase().includes(filter));
    tr[i].style.display = match ? "" : "none";
  }
}

function logout() {
  localStorage.removeItem("ad_session");
  window.location.href = "ad_login.html";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

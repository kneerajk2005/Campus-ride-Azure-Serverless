<script>
window.addEventListener('load', () => {
  document.body.classList.add('loaded');
});

function logout() {
  localStorage.removeItem("student_data");
}
document.getElementById("pickupForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const student = JSON.parse(localStorage.getItem("student_data"));

  if (!student) {
    alert("Session expired. Please log in again.");
    window.location.href = "student_login.html";
    return;
  }

  const username1 = student.username1;
  const new_pickup = document.getElementById("pickup_location").value.trim();

  if (!new_pickup) {
    alert("Please enter a pickup location!");
    return;
  }

  // ✅ Add this line here
  console.log("Sending to backend:", { username1, pickup_location: new_pickup });

  try {
    const response = await fetch("https://neeraj-backend-1-e2febqdsb5fwhvfg.canadacentral-01.azurewebsites.net/api/update_pickup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username1, pickup_location: new_pickup })
    });

    const data = await response.json();
    console.log("Response from backend:", data);

    if (response.ok) {
      alert(data.message || "Pickup location updated successfully!");
    } else {
      alert(data.error || "Failed to update pickup location.");
    }

  } catch (error) {
    alert("Network or server error occurred.");
    console.error(error);
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
